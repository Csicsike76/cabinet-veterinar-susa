<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cabinet Veterinar Dr. Ioan Susa – aplicație gratuită</title>
  <meta name="description" content="Aplicația gratuită a Cabinetului Veterinar Dr. Ioan Susa, Satu Mare. Android și iPhone." />
  <meta name="theme-color" content="#02685A" />
  <link rel="icon" type="image/png" href="img/icon.png" />
  <style>
    :root { --green:#02685a; --green-d:#013a33; --navy:#0b1f4f; --blue:#002b7f; --yellow:#fcd116; --red:#ce1126; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; min-height: 100vh;
      background: linear-gradient(170deg, rgba(11,31,79,.72), rgba(2,104,90,.78) 55%, rgba(1,58,51,.92)), url('img/clinic-exterior.webp') center 35%/cover fixed, var(--green);
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .stripe { height: 5px; margin: 0 -16px; background: linear-gradient(90deg, var(--blue) 0 33.3%, var(--yellow) 33.3% 66.6%, var(--red) 66.6%); }
    main { max-width: 520px; margin: 0 auto; }
    header { text-align: center; padding: 28px 0 8px; }
    header img { width: min(280px, 80%); height: auto; }
    h1 { font-size: 1.35rem; line-height: 1.3; margin: 14px 0 4px; }
    .sub { opacity: .9; margin: 0 0 6px; }
    .free { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 800; border-radius: 999px; padding: 4px 14px; margin-top: 6px; }
    .langs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 18px 0 8px; }
    .langs button { min-height: 44px; min-width: 64px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-weight: 700; font-size: .95rem; cursor: pointer; }
    .langs button[aria-pressed="true"] { background: #fff; color: var(--green); }
    .card { background: rgba(255,255,255,.95); color: var(--navy); border-radius: 24px; padding: 18px; margin: 14px 0; box-shadow: 0 16px 40px -18px rgba(0,0,0,.6); }
    .card.mine { outline: 4px solid var(--yellow); }
    .card h2 { margin: 0 0 4px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
    .mine-tag { display: none; font-size: .75rem; background: var(--yellow); border-radius: 999px; padding: 2px 10px; }
    .card.mine .mine-tag { display: inline-block; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 18px; font-weight: 800; font-size: 1.05rem; text-decoration: none; margin: 12px 0 6px; padding: 10px 16px; text-align: center; }
    .btn.green { background: var(--green); color: #fff; }
    .btn.navy { background: var(--navy); color: #fff; }
    ol { margin: 8px 0 0; padding-inline-start: 22px; line-height: 1.5; }
    li { margin: 4px 0; }
    .note { font-size: .88rem; color: #475569; margin: 8px 0 0; }
    .share { display: inline-block; vertical-align: -4px; }
    footer { text-align: center; font-size: .9rem; opacity: .95; margin-top: 18px; line-height: 1.6; }
    footer a { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main>
    <header>
      <img src="img/logo-white.webp" alt="Cabinet Veterinar Dr. Ioan Susa" />
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
      <span class="free" data-i="free"></span>
    </header>

    <nav class="langs" aria-label="Language">
      <button data-lang="ro">Română</button>
      <button data-lang="hu">Magyar</button>
      <button data-lang="en">English</button>
      <button data-lang="de">Deutsch</button>
    </nav>

    <section class="card" id="android">
      <h2>🤖 Android <span class="mine-tag" data-i="yours"></span></h2>
      <a class="btn green" href="CabinetVet-DrSusa.apk" download><span aria-hidden="true">⬇️</span> <span data-i="a_btn"></span></a>
      <ol>
        <li data-i="a1"></li>
        <li data-i="a2"></li>
        <li data-i="a3"></li>
      </ol>
      <p class="note" data-i="a_note"></p>
    </section>

    <section class="card" id="iphone">
      <h2>🍎 iPhone <span class="mine-tag" data-i="yours"></span></h2>
      <a class="btn navy" href="app/"><span aria-hidden="true">📲</span> <span data-i="i_btn"></span></a>
      <ol>
        <li data-i="i1"></li>
        <li><span data-i="i2"></span> <svg class="share" width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 1v13M4.5 5.5 9 1l4.5 4.5M3 9H1.8v11.2h14.4V9H15" fill="none" stroke="#0b1f4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
        <li data-i="i3"></li>
        <li data-i="i4"></li>
      </ol>
      <p class="note" data-i="i_note"></p>
    </section>

    <footer>
      <div>Str. Bogdan Petriceicu Hașdeu nr. 6, Satu Mare</div>
      <div>📞 <a href="tel:+40753434589">0753 434 589</a> · <a href="tel:+40744535962">0744 535 962</a></div>
      <div><a href="https://susa.ro/">susa.ro</a> · <a href="https://www.facebook.com/drsusaioan">Facebook</a></div>
    </footer>
  </main>

  <script>
    // Texts for the four languages of the clinic's clients. The app name stays Romanian.
    const T = {
      ro: {
        title: 'Aplicația cabinetului, gratuit', sub: 'Carnetul de sănătate al animalului tău, mementouri și contactul cu cabinetul – totul în telefon.', free: 'Gratuit · fără cont · fără reclame', yours: 'telefonul tău',
        a_btn: 'Descarcă pentru Android', a1: 'Apasă butonul de mai sus și deschide fișierul descărcat.', a2: 'Dacă telefonul întreabă, permite instalarea din această sursă („Instalare aplicații necunoscute”).', a3: 'Apasă „Instalează”, apoi „Deschide”.', a_note: 'Aplicația este oferită de cabinet; datele rămân doar pe telefonul tău.',
        i_btn: 'Deschide aplicația în Safari', i1: 'Deschide aplicația cu butonul de mai sus (în Safari).', i2: 'Apasă butonul Partajare', i3: 'Alege „Adaugă pe ecranul principal”.', i4: 'Apasă „Adaugă” – pictograma apare pe ecran, ca orice aplicație.', i_note: 'Pe iPhone datele rămân în telefon; salvarea se face în fișier (iCloud / Fișiere).'
      },
      hu: {
        title: 'A rendelő alkalmazása, ingyen', sub: 'Kedvenced egészségügyi könyve, emlékeztetők és a rendelő elérhetősége – mind a telefonodon.', free: 'Ingyenes · regisztráció nélkül · reklám nélkül', yours: 'a te telefonod',
        a_btn: 'Letöltés Androidra', a1: 'Nyomd meg a fenti gombot, és nyisd meg a letöltött fájlt.', a2: 'Ha a telefon kérdezi, engedélyezd a telepítést ebből a forrásból („Ismeretlen alkalmazások telepítése”).', a3: 'Nyomd meg a „Telepítés”, majd a „Megnyitás” gombot.', a_note: 'Az alkalmazást a rendelő adja; az adataid csak a telefonodon maradnak.',
        i_btn: 'Az alkalmazás megnyitása Safariban', i1: 'Nyisd meg az alkalmazást a fenti gombbal (Safariban).', i2: 'Koppints a Megosztás gombra', i3: 'Válaszd a „Főképernyőhöz adás” lehetőséget.', i4: 'Koppints a „Hozzáadás” gombra – az ikon megjelenik a kezdőképernyőn, mint bármelyik app.', i_note: 'iPhone-on az adatok a telefonon maradnak; a mentés fájlba történik (iCloud / Fájlok).'
      },
      en: {
        title: "The clinic's app, free", sub: "Your pet's health record, reminders and the clinic's contacts – all on your phone.", free: 'Free · no account · no ads', yours: 'your phone',
        a_btn: 'Download for Android', a1: 'Tap the button above and open the downloaded file.', a2: 'If your phone asks, allow installing from this source ("Install unknown apps").', a3: 'Tap "Install", then "Open".', a_note: 'The app is a gift from the clinic; your data stays on your phone only.',
        i_btn: 'Open the app in Safari', i1: 'Open the app with the button above (in Safari).', i2: 'Tap the Share button', i3: 'Choose "Add to Home Screen".', i4: 'Tap "Add" – the icon appears on your home screen like any app.', i_note: 'On iPhone your data stays on the phone; backups are saved as a file (iCloud / Files).'
      },
      de: {
        title: 'Die App der Praxis, kostenlos', sub: 'Gesundheitsheft Ihres Tieres, Erinnerungen und die Kontakte der Praxis – alles auf Ihrem Telefon.', free: 'Kostenlos · ohne Konto · ohne Werbung', yours: 'Ihr Telefon',
        a_btn: 'Für Android herunterladen', a1: 'Tippen Sie auf die Schaltfläche oben und öffnen Sie die heruntergeladene Datei.', a2: 'Wenn das Telefon fragt, erlauben Sie die Installation aus dieser Quelle („Unbekannte Apps installieren“).', a3: 'Tippen Sie auf „Installieren“ und dann auf „Öffnen“.', a_note: 'Die App ist ein Geschenk der Praxis; Ihre Daten bleiben nur auf Ihrem Telefon.',
        i_btn: 'App in Safari öffnen', i1: 'Öffnen Sie die App mit der Schaltfläche oben (in Safari).', i2: 'Tippen Sie auf „Teilen“', i3: 'Wählen Sie „Zum Home-Bildschirm“.', i4: 'Tippen Sie auf „Hinzufügen“ – das Symbol erscheint wie jede App auf dem Home-Bildschirm.', i_note: 'Auf dem iPhone bleiben die Daten auf dem Telefon; Sicherungen werden als Datei gespeichert (iCloud / Dateien).'
      }
    };
    const pick = () => {
      try { const saved = localStorage.getItem('cvs-lang'); if (T[saved]) return saved; } catch (e) {}
      for (const l of navigator.languages || [navigator.language]) { const c = String(l).slice(0, 2).toLowerCase(); if (T[c]) return c; }
      return 'ro';
    };
    const apply = (lang) => {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = T[lang][el.dataset.i]; });
      document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      try { localStorage.setItem('cvs-lang', lang); } catch (e) {}
    };
    document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => apply(b.dataset.lang)));
    apply(pick());

    // Highlight the visitor's own system and show it first.
    const ua = navigator.userAgent;
    const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const mine = document.getElementById(ios ? 'iphone' : /Android/.test(ua) ? 'android' : '');
    if (mine) { mine.classList.add('mine'); mine.parentNode.insertBefore(mine, document.getElementById('android')); }
  </script>
</body>
</html>
